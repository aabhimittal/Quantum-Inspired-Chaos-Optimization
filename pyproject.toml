[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-chaos"
dynamic = ["version"]
description = "Quantum-inspired chaos optimization: use quantum heuristics to find worst-case failure combinations and stress-test AI systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
keywords = [
    "quantum",
    "chaos-engineering",
    "optimization",
    "adversarial",
    "stress-testing",
    "qaoa",
    "grover",
    "qiskit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
]
algorithms = [
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
all = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
    "matplotlib>=3.5",
    "pytest>=7.0",
]

[project.scripts]
qchaos = "quantum_chaos.cli:main"

[project.urls]
Homepage = "https://github.com/aabhimittal/quantum-inspired-chaos-optimization"
Repository = "https://github.com/aabhimittal/quantum-inspired-chaos-optimization"

[tool.setuptools]
packages = [
    "quantum_chaos",
    "quantum_chaos.core",
    "quantum_chaos.targets",
    "quantum_chaos.quantum",
    "quantum_chaos.optimizers",
    "quantum_chaos.viz",
]

[tool.setuptools.dynamic]
version = { attr = "quantum_chaos._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
